<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490"><title>Momentum, made visible</title><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-104}}
@keyframes twinkle{50%{fill-opacity:.35}}
@keyframes reveal{from{opacity:1;transform:translateY(0)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{0%{stroke-dashoffset:1}35%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
.orbit{animation:orbit 18s linear infinite}.flow{animation:flow 5s linear infinite}
.twinkle{animation:twinkle 4s ease-in-out infinite}.reveal{animation:reveal .8s ease-out backwards}
.draw{stroke-dasharray:1;animation:draw 7s ease-in-out infinite}
