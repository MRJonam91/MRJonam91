name: Update public GitHub profile data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_profile.py'
      - 'tests/test_update_profile.py'
      - '.github/workflows/update-profile.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test profile updater
        env:
          PYTHONPATH: scripts
        run: python3 -m unittest discover -s tests -v
      - name: Refresh public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile.py
      - name: Commit changes when needed
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'chore: refresh public GitHub profile data'
            git push
          fi
